<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desafio da Inovação</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .tela {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
    }

    .verde {
      background: #22c55e;
      color: white;
    }

    .azul {
      background: #3b82f6;
      color: white;
    }

    .vermelho {
      background: #ef4444;
      color: white;
    }

    .laranja {
      background: #f59e0b;
      color: white;
    }

    .alternativa {
      background: white;
      color: #222;
    }

    .alternativa:active {
      transform: scale(0.98);
    }

    #codigoSala {
      font-size: 35px;
      font-weight: bold;
      letter-spacing: 5px;
      margin: 20px 0;
    }

    #timer {
      font-size: 40px;
      font-weight: bold;
      margin: 15px;
    }

    #pergunta {
      font-size: 23px;
      font-weight: bold;
      margin: 25px 0;
    }

    .escondido {
      display: none;
    }

    #listaJogadores {
      text-align: left;
      margin-top: 20px;
    }

    .jogador {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <!-- INÍCIO -->
  <div id="inicio" class="tela">
    <div class="card">
      <h1>🎮 Desafio da Inovação</h1>

      <button id="btnCriar" class="verde">
        CRIAR PARTIDA
      </button>

      <button id="btnEntrar" class="azul">
        ENTRAR NA PARTIDA
      </button>
    </div>
  </div>


  <!-- CRIAR -->
  <div id="criar" class="tela escondido">
    <div class="card">
      <h1>👨‍🏫 Criar partida</h1>

      <input
        id="nomeProfessor"
        placeholder="Nome do professor"
      >

      <button id="confirmarCriacao" class="verde">
        Criar partida
      </button>
    </div>
  </div>


  <!-- ENTRAR -->
  <div id="entrar" class="tela escondido">
    <div class="card">
      <h1>👩‍🎓 Entrar na partida</h1>

      <input
        id="codigo"
        placeholder="Código da partida"
        maxlength="6"
      >

      <input
        id="nomeJogador"
        placeholder="Seu nome"
      >

      <button id="confirmarEntrada" class="azul">
        Entrar
      </button>
    </div>
  </div>


  <!-- SALA -->
  <div id="sala" class="tela escondido">
    <div class="card">

      <h1>🚀 Sala de espera</h1>

      <p>Código da partida:</p>

      <div id="codigoSala"></div>

      <h2>👥 Jogadores</h2>

      <div id="listaJogadores"></div>

      <button
        id="btnIniciar"
        class="verde escondido"
      >
        INICIAR PARTIDA
      </button>

    </div>
  </div>


  <!-- JOGO -->
  <div id="jogo" class="tela escondido">
    <div class="card">

      <h1>🎯 Pergunta 1</h1>

      <div id="timer">15</div>

      <div id="pergunta">
        O que é inovação?
      </div>

      <button class="alternativa" onclick="responder(0)">
        A) Criar ou melhorar algo de forma útil
      </button>

      <button class="alternativa" onclick="responder(1)">
        B) Fazer sempre exatamente a mesma coisa
      </button>

      <button class="alternativa" onclick="responder(2)">
        C) Evitar qualquer mudança
      </button>

      <button class="alternativa" onclick="responder(3)">
        D) Copiar tudo sem modificar
      </button>

      <p id="mensagem"></p>

    </div>
  </div>


<script>

  const socket = io();

  let codigoSala = "";
  let souProfessor = false;
  let tempo = 15;
  let intervalo;


  const inicio = document.getElementById("inicio");
  const criar = document.getElementById("criar");
  const entrar = document.getElementById("entrar");
  const sala = document.getElementById("sala");
  const jogo = document.getElementById("jogo");


  function mostrar(tela) {

    inicio.classList.add("escondido");
    criar.classList.add("escondido");
    entrar.classList.add("escondido");
    sala.classList.add("escondido");
    jogo.classList.add("escondido");

    tela.classList.remove("escondido");
  }


  document.getElementById("btnCriar").onclick = () => {
    mostrar(criar);
  };


  document.getElementById("btnEntrar").onclick = () => {
    mostrar(entrar);
  };


  document.getElementById("confirmarCriacao").onclick = () => {

    const nome =
      document.getElementById("nomeProfessor").value.trim();

    if (!nome) {
      alert("Digite seu nome.");
      return;
    }

    souProfessor = true;

    socket.emit("criar-partida", {
      nome: nome
    });
  };


  document.getElementById("confirmarEntrada").onclick = () => {

    const codigo =
      document.getElementById("codigo").value.trim();

    const nome =
      document.getElementById("nomeJogador").value.trim();

    if (!codigo || !nome) {
      alert("Digite o código e seu nome.");
      return;
    }

    socket.emit("entrar-partida", {
      codigo: codigo,
      nome: nome
    });
  };


  socket.on("partida-criada", (dados) => {

    codigoSala = dados.codigo;

    document.getElementById("codigoSala").textContent =
      dados.codigo;

    document.getElementById("btnIniciar")
      .classList.remove("escondido");

    atualizarJogadores(dados.jogadores);

    mostrar(sala);
  });


  socket.on("entrou-partida", (dados) => {

    codigoSala = dados.codigo;

    document.getElementById("codigoSala").textContent =
      dados.codigo;

    atualizarJogadores(dados.jogadores);

    mostrar(sala);
  });


  socket.on("jogadores-atualizados", (dados) => {

    atualizarJogadores(dados.jogadores);
  });


  function atualizarJogadores(jogadores) {

    const lista =
      document.getElementById("listaJogadores");

    lista.innerHTML = "";

    jogadores.forEach(jogador => {

      const div =
        document.createElement("div");

      div.className = "jogador";

      div.textContent =
        "👤 " + jogador.nome;

      lista.appendChild(div);

    });
  }


  document.getElementById("btnIniciar").onclick = () => {

    socket.emit("iniciar-partida", {
      codigo: codigoSala
    });

  };


  socket.on("partida-iniciada", (dados) => {

    mostrar(jogo);

    iniciarTimer();

  });


  function iniciarTimer() {

    tempo = 15;

    document.getElementById("timer").textContent =
      tempo;

    clearInterval(intervalo);

    intervalo = setInterval(() => {

      tempo--;

      document.getElementById("timer").textContent =
        tempo;

      if (tempo <= 0) {

        clearInterval(intervalo);

        document.getElementById("mensagem").textContent =
          "⏰ Tempo esgotado!";

        bloquearAlternativas();
      }

    }, 1000);

  }


  function responder(opcao) {

    clearInterval(intervalo);

    const mensagem =
      document.getElementById("mensagem");

    if (opcao === 0) {

      mensagem.textContent =
        "✅ Resposta selecionada!";

    } else {

      mensagem.textContent =
        "❌ Resposta selecionada!";

    }

    bloquearAlternativas();
  }


  function bloquearAlternativas() {

    document
      .querySelectorAll(".alternativa")
      .forEach(botao => {

        botao.disabled = true;

        botao.style.opacity = "0.6";

      });

  }


  socket.on("erro-partida", (mensagem) => {

    alert(mensagem);

  });

</script>

</body>
</html>
